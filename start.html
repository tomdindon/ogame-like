<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Empires - Démarrer</title>

    <!-- Police Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-accent-cyan: #00eaff;
            --color-accent-purple: #9b5cff;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #0a0f1f, #05060a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
        }

        #start-screen {
            text-align: center;
            animation: fadeIn 1.5s ease;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-accent-cyan), var(--color-accent-purple));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.12em;
            margin-bottom: 2.5rem;
        }

        .start-button {
            display: inline-block;
            padding: 1rem 3rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--color-accent-cyan), var(--color-accent-purple));
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .start-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 25px rgba(0, 234, 255, 0.45);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <section id="start-screen">
        <h1 class="game-title">Cosmic Empires</h1>
        <a href="index.html" class="start-button">Démarrer</a>
    </section>

</body>
</html>
