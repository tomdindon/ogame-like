<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Laboratoire de transmutation</title>
    <link rel="stylesheet" href="css/labo.css">
</head>
<body>

    <h1>Laboratoire de transmutation</h1>
    <p class="subtitle">
        Ici, la matière perd ses lois. Les ressources se recomposent et renaissent sous de nouvelles formes.
    </p>

    <!-- Bloc 2 colonnes -->
    <div class="section grid-2" id="recipeColumns">

        <!-- Colonne 1 : choix ressource -->
       <div class="col">
    <h3>Ressource d’entrée</h3>

    <div class="col-content" id="inputDisplay">
        <select id="inputSelect">
            <option value="">-- Choisir une ressource --</option>
            <option value="scrap">Ferraille</option>
            <option value="energie">Énergie</option>
            <option value="nano">Nano‑composants</option>
            <option value="data">Données anciennes</option>
        </select>

        <span id="inputEmoji" class="emoji-display"></span>

        <!-- BOX COÛT ENTRÉE -->
        <span id="inputCost" class="cost-item">Coût : -</span>
    </div>
</div>


        <!-- Colonne 2 : résultat -->
        <div class="col">
    <h3>Résultat obtenu</h3>

    <div class="col-content" id="outputDisplay">
        <span id="outputText" class="result-name">Sélectionnez une ressource.</span>

        <span id="outputEmoji" class="emoji-display"></span>

        <!-- BOX GAIN SORTIE -->
        <span id="outputGain" class="cost-item">Gain : -</span>
    </div>
</div>


    </div>

    <!-- Bouton centré -->
    <div class="section center">
        <button id="startBtn" disabled>Lancer la transmutation</button>
    </div>

</div>
    

    <!-- Zone de feedback -->
    <div class="section status-box" id="statusBox">
        Aucune transmutation en cours.
    </div>

    <script src="js/labo.js"></script>
</body>
</html>
